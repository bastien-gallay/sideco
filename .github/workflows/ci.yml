name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A branch pushed again before its run ends: the older run stops. On main each
# commit has a group of its own: no run there is stopped, nor dropped while it waits.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A branch is pushed, waits for this workflow, then main is fast-forwarded to
  # the same commit: that commit was tested as it is, and is not tested twice.
  seen:
    name: Was this commit tested already?
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      green: ${{ steps.find.outputs.green }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: repos/${{ github.repository }}/actions/workflows/ci.yml/runs
        # Any doubt, an error of the API included, and the commit is tested. A run asked
        # for again ("Re-run all jobs") always tests: that is how a commit is tested twice.
        run: |
          count=$(gh api "$RUNS?head_sha=${{ github.sha }}&status=success&per_page=1" --jq '.total_count' || echo 0)
          if [ "${{ github.run_attempt }}" = "1" ] && [ "${count:-0}" -gt 0 ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi
          echo "attempt ${{ github.run_attempt }}, successful runs of this commit: ${count:-0}"

  check:
    name: Types, lint, unit and integration tests
    needs: seen
    # The question failing is a doubt too: the commit is tested.
    if: ${{ !cancelled() && needs.seen.outputs.green != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  e2e:
    name: End-to-end tests in Chrome
    needs: seen
    # The question failing is a doubt too: the commit is tested.
    if: ${{ !cancelled() && needs.seen.outputs.green != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: google-chrome --version
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
